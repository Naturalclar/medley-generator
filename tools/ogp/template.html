<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <style>
      /*
        OGP画像の版下。1200x630 は og:image の推奨比 (1.91:1)。
        配色はアプリのダークテーマ(src/index.css)に合わせる。
      */
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 1200px;
        height: 630px;
        display: flex;
        align-items: center;
        gap: 3.5rem;
        padding: 4.5rem 5rem;
        background:
          radial-gradient(120% 90% at 100% 0%, #2e2440 0%, transparent 60%),
          radial-gradient(90% 80% at 0% 100%, #241c33 0%, transparent 55%),
          #17151b;
        color: #e8e6ec;
        font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif;
        overflow: hidden;
      }

      .copy { flex: 1 1 auto; min-width: 0; }

      .mark {
        width: 84px;
        height: 84px;
        margin-bottom: 2rem;
      }

      h1 {
        font-size: 76px;
        line-height: 1.15;
        letter-spacing: 0.01em;
        font-weight: 800;
      }

      p {
        margin-top: 1.5rem;
        font-size: 30px;
        line-height: 1.6;
        color: #a8a2b3;
      }

      .url {
        margin-top: 2.5rem;
        display: inline-block;
        padding: 0.5rem 1.25rem;
        border: 1px solid #4b4358;
        border-radius: 999px;
        font-size: 24px;
        color: #c9c3d4;
      }

      /*
        右側はキャラクター画像の枠。art.png を置くと出る。
        無い場合(onerror で hidden)はコピーだけの版になる。
      */
      .art {
        flex: 0 0 380px;
        height: 100%;
        border-radius: 24px;
        object-fit: cover;
        object-position: top center;
        border: 1px solid #38343f;
      }
      .art.hidden { display: none; }
    </style>
  </head>
  <body>
    <div class="copy">
      <img class="mark" src="../../public/favicon.svg" alt="" />
      <h1>メドレーセトリ生成</h1>
      <p>配信で演奏するメドレーの曲目を自動で組む</p>
      <span class="url">smashcat.dev/medley-generator</span>
    </div>
    <img
      class="art"
      src="./art.png"
      alt=""
      onerror="this.classList.add('hidden')"
    />
  </body>
</html>
