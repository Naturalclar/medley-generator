<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>メドレーセトリ生成</title>
    <meta
      name="description"
      content="配信で演奏するメドレーの曲目を自動で組むツール。生成したセトリはYouTubeで連続再生でき、自分のYouTubeアカウントに限定公開プレイリストとして保存もできます。"
    />
    <!--
      配信元は GitHub Pages だが、公開URLは smashcat.dev 側。同じ内容が両方の
      オリジンから見えるため、canonical で smashcat.dev を正規と明示する。
    -->
    <link rel="canonical" href="https://smashcat.dev/medley-generator/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://smashcat.dev/medley-generator/" />
    <meta property="og:title" content="メドレーセトリ生成" />
    <meta
      property="og:description"
      content="配信で演奏するメドレーの曲目を自動で組むツール。生成したセトリはYouTubeで連続再生でき、自分のYouTubeアカウントに限定公開プレイリストとして保存もできます。"
    />
    <!--
      og:image は絶対URLでしか解決されない(SNSのクローラは相対パスを辿らない)ので、
      canonical と同じ smashcat.dev を指す。画像は tools/ogp/build.mjs で生成する。
    -->
    <meta
      property="og:image"
      content="https://smashcat.dev/medley-generator/ogp.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="メドレーセトリ生成" />
    <meta property="og:site_name" content="メドレーセトリ生成" />
    <meta property="og:locale" content="ja_JP" />
    <!-- 1200x630 を大きく出すカード形式 -->
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
